[workspace]
resolver = "3"
# Patched third-party crates, built as dependencies only; see vendor/README.md.
exclude = ["vendor"]
members = ["crates/gse-app", "crates/gse-guest", "crates/gse-host", "crates/gse-protocol", "crates/gse-screen", "crates/gse-service", "crates/gse-viewer"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
fatfs = "0.3"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
serde_json = "1"
rustix = { version = "1", features = ["net", "process"] }
ctrlc = { version = "3", features = ["termination"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
gpui-component = { path = "vendor/gpui-component" }
