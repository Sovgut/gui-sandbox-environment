[package]
name = "gse-app"
description = "The gse app: environments, their screen and their files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "gse"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
futures = "0.3"
gpui = { package = "gpui-pre", version = "=0.3.10" }
gpui-kit = "0.8.1"
gse-protocol = { path = "../gse-protocol" }
gse-screen = { path = "../gse-screen" }
image = "0.25"
regex = "1"
base64 = "0.22"
ed25519-dalek = "2"
semver = "1"
serde.workspace = true
ureq = { version = "2", features = ["json"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
smallvec = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
toml.workspace = true

[lints]
workspace = true
