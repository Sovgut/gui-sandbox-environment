# The account passt runs as for environment networking. The host firewall filters
# only this account's traffic, so nothing else may run as it.
u gse-net - "gse environment network" - -
# The account the antivirus scans files and updates its signatures as
# (crates/gse-service/src/antivirus.rs): never root, since it reads files
# made to exploit it.
u gse-scan - "gse antivirus" - -
