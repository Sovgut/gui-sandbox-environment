# Game launchers and the tools around them, with a browser for the sign-ins
# and links they open. Everything runs as `guest` except Discord, which runs
# as `sandbox` so it stays out of reach of what the launchers start.
name = "launchers"
title = "Game launchers"

[[app]]
name = "Steam"
dnf = ["steam"]
desktop = "steam.desktop"
command = ["steam"]

[[app]]
name = "Lutris"
dnf = ["lutris"]
desktop = "net.lutris.Lutris.desktop"
command = ["lutris"]

[[app]]
name = "Heroic"
flatpak = "com.heroicgameslauncher.hgl"

[[app]]
name = "ProtonPlus"
flatpak = "com.vysp3r.ProtonPlus"

[[app]]
name = "Bottles"
flatpak = "com.usebottles.bottles"

[[app]]
name = "Faugus Launcher"
flatpak = "io.github.Faugus.faugus-launcher"

[[app]]
name = "Chrome"
dnf = ["google-chrome-stable"]
repos = ["google-chrome"]
desktop = "google-chrome.desktop"
command = ["google-chrome-stable"]

[[app]]
name = "Discord"
flatpak = "com.discordapp.Discord"
trusted = true
