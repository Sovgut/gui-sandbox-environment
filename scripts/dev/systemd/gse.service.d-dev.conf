# Development drop-in for gse.service (installed as
# /etc/systemd/system/gse.service.d/dev.conf by install-dev-service.sh):
# runs the development build of the service from /usr/local/sbin.
#
# The service never copies a build out of the working tree itself: anything
# running as the developer can write there, and a service that ran it as
# root would hand root to every such process. gse-dev-install puts a build
# in place, behind an administrator password.
[Service]
ExecStart=
ExecStart=/usr/local/sbin/gse-service daemon
