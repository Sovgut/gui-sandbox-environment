# Development drop-in for gse.service (install as
# /etc/systemd/system/gse.service.d/dev.conf): runs the service from the
# working tree's debug build. systemd may not execute files labelled as user
# content, so every start first copies the build to /usr/local/sbin; a
# service restart therefore also picks up a new build.
[Service]
ExecStartPre=/usr/bin/install -m 0755 -Z /mnt/Storage/Data/Development/Private/gui-sandbox-environment/target/debug/gse-service /usr/local/sbin/gse-service
ExecStart=
ExecStart=/usr/local/sbin/gse-service daemon
